name: Сборка и тесты

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - run: dotnet restore CommCodeVerifier.sln
      - run: dotnet build CommCodeVerifier.sln -c Release --no-restore
      - run: dotnet test CommCodeVerifier.sln -c Release --no-build --logger trx --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults
