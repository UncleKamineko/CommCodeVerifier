name: Публикация релиза

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Тесты
        run: dotnet test CommCodeVerifier.sln -c Release

      - name: Публикация (один exe, .NET внутри)
        shell: pwsh
        run: |
          # Версия задаётся заголовком окна (MainWindow.xaml); тег должен с ней совпадать.
          $v = "${{ github.event.release.tag_name }}".TrimStart('v')
          $xaml = Get-Content src/CommCodeVerifier.Wpf/MainWindow.xaml -Raw -Encoding utf8
          $title = [regex]::Match($xaml, '(?<=Title="CommCodeVerifier v)[0-9][^"]*').Value
          if ($title -ne $v) {
            Write-Error "Тег v$v не совпадает с версией в заголовке окна: v$title"
            exit 1
          }
          dotnet publish src/CommCodeVerifier.Wpf/CommCodeVerifier.Wpf.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:EnableCompressionInSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=none `
            -o publish
          Compress-Archive -Path publish/* -DestinationPath "CommCodeVerifier.v$v.zip"

      - name: Прикрепить zip к релизу
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" (Get-ChildItem CommCodeVerifier.v*.zip)
